version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: local-toolbox-omni-redis
    restart: unless-stopped
    volumes:
      - ./redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  omniroute:
    container_name: local-toolbox-omni
    depends_on:
      redis:
        condition: service_healthy
    # Pinned: bump only after backing up data/ (new versions run DB migrations)
    image: diegosouzapw/omniroute:3.8.50
    restart: unless-stopped
    stop_grace_period: 40s
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - PORT=${PORT:-20130}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-20130}
      - API_PORT=${API_PORT:-20131}
      - REDIS_URL=redis://redis:6379
      - LIVE_WS_PORT=${LIVE_WS_PORT:-20132}
      - LIVE_WS_HOST=127.0.0.1
      - API_HOST=127.0.0.1
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:20130}
      - LIVE_WS_ALLOWED_ORIGINS=${PUBLIC_URL:-http://localhost:20130}
    ports:
      - "20130:20130"
      - "20131:20131"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
